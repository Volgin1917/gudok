name: Ежедневный выпуск
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"   # 07:30 UTC+4 ежедневно
  workflow_dispatch: {}
env:
  GUDOK_VK_TOKEN: ${{ secrets.VK_TOKEN }}   # пуст, пока секрет не задан — коллектор мягко пропускает VK
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gudok-pipeline        # общая очередь daily/weekly/monthly: гоняют run.sh и пушат в main —
  cancel-in-progress: false    # только один прогон за раз, свежие ждут (гонки git push исключены)
jobs:
  build:
    if: github.actor != 'gudok-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Конвейер дня
        run: bash run.sh
      - name: Коммит и push (защищено от гонок)
        env:
          REBUILD_CMD: bash run.sh          # пересборка, если rebase упёрся в конфликт
        run: |
          bash ci_push.sh "Ежедневный выпуск $(date -u +%F)" \
            data digests index.html afisha.html infospace.html status.html \
            weekly.html monthly.html projects.html projects archive.html projects/plans.html \
            methods.html \
            assets weekly monthly
      - name: Артефакт сайта (свежие страницы, а не триггерный коммит)
        # upload-pages-artifact выполняется ЗДЕСЬ, в build-джобе, сразу после ci_push.sh:
        # рабочий каталог содержит ровно те страницы, которые только что собраны и
        # закоммичены. Раньше артефакт собирала publish-джоба отдельным checkout@v4
        # без ref — это github.sha, состояние ДО run.sh, из-за чего на Pages уезжал
        # прошлый выпуск, а сегодняшний pojawлялся только на следующий прогон.
        uses: actions/upload-pages-artifact@v3
        with: {path: .}
  publish:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/deploy-pages@v4
