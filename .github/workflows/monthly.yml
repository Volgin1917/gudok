name: Месячный отчёт
on:
  schedule:
    - cron: "0 6 1 * *"   # 1-е число, 09:00 UTC+4: отчёт за прошедший месяц
  workflow_dispatch:
    inputs:
      month:
        description: "Период отчёта YYYY-MM (по умолчанию прошедший месяц)"
        required: false
env:
  GUDOK_VK_TOKEN: ${{ secrets.VK_TOKEN }}   # пуст, пока секрет не задан — коллектор мягко пропускает VK
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gudok-pipeline        # общая очередь daily/weekly/monthly — см. daily.yml
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Конвейер + месячный отчёт
        run: |
          bash run.sh
          YM='${{ inputs.month }}'
          [ -n "$YM" ] || YM=$(date -d 'last month' +%Y-%m)
          python3 generate.py --monthly "$YM"
      - name: Коммит и push (защищено от гонок)
        env:
          REBUILD_CMD: bash run.sh && python3 generate.py --monthly "${YM:-$(date -d 'last month' +%Y-%m)}"
        run: bash ci_push.sh "Месячный отчёт $(date -u +%F)" data monthly monthly.html assets archive.html
  publish:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - uses: actions/deploy-pages@v4
