name: Еженедельный аналитический
on:
  schedule:
    - cron: "0 5 * * 1"   # понедельник 08:00 UTC+4: скелет недели за завершённый период
  workflow_dispatch: {}
env:
  GUDOK_VK_TOKEN: ${{ secrets.VK_TOKEN }}   # пуст, пока секрет не задан — коллектор мягко пропускает VK
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gudok-pipeline        # общая очередь daily/weekly/monthly — см. daily.yml
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Конвейер + скелет недели
        run: |
          bash run.sh
          python3 generate.py --weekly-new
      - name: Коммит и push (защищено от гонок)
        env:
          REBUILD_CMD: bash run.sh && python3 generate.py --weekly-new
        run: bash ci_push.sh "Скелет недельника $(date -u +%F)" data weekly weekly.html assets archive.html
  publish:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - uses: actions/deploy-pages@v4
